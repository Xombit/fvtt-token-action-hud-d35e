name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive release metadata
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          REPO_URL="https://github.com/${{ github.repository }}"
          MANIFEST_URL="${REPO_URL}/releases/latest/download/module.json"
          DOWNLOAD_URL="${REPO_URL}/releases/download/${TAG}/module.zip"
          {
            echo "TAG=${TAG}"
            echo "VERSION=${VERSION}"
            echo "REPO_URL=${REPO_URL}"
            echo "MANIFEST_URL=${MANIFEST_URL}"
            echo "DOWNLOAD_URL=${DOWNLOAD_URL}"
          } >> "$GITHUB_ENV"

      - name: Stage release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cp module.json dist-release/module.json

          jq \
            --arg version "$VERSION" \
            --arg url "$REPO_URL" \
            --arg manifest "$MANIFEST_URL" \
            --arg download "$DOWNLOAD_URL" \
            '.version = $version | .url = $url | .manifest = $manifest | .download = $download' \
            dist-release/module.json > dist-release/module.json.tmp
          mv dist-release/module.json.tmp dist-release/module.json

          jq -e '.id and .version and .manifest and .download' dist-release/module.json > /dev/null

          cp README.md dist-release/README.md
          cp -R scripts dist-release/scripts
          cp -R languages dist-release/languages

          if [ -f LICENSE ]; then
            cp LICENSE dist-release/LICENSE
          fi

          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md dist-release/CHANGELOG.md
          fi

      - name: Create module archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist-release
          zip -r ../module.zip ./*

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist-release/module.json module.zip --clobber

      - name: Publish workflow summary
        shell: bash
        run: |
          {
            echo "## Release Assets"
            echo
            echo "- Version: $VERSION"
            echo "- Manifest: $MANIFEST_URL"
            echo "- Download: $DOWNLOAD_URL"
            echo
            echo "### Packaged Paths"
            (cd dist-release && find . -maxdepth 2 | sort)
          } >> "$GITHUB_STEP_SUMMARY"